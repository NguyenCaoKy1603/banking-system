openapi: 3.1.0
info:
  title: Banking MVP Accounts and Transfers API
  version: 0.2.0-draft
  description: |
    DRAFT only. This contract requires backend, core-banking partner and
    legal/compliance approval before any real-money pilot. Authenticated
    operations also require X-Device-ID for device binding.
servers:
  - url: https://api.example.invalid/api/v1
    description: Placeholder; replace through approved environment configuration.
tags:
  - name: Auth
  - name: Control
  - name: Notifications
  - name: Fraud
  - name: Sandbox
  - name: Recipients
  - name: Accounts
  - name: Transfers
  - name: Savings
  - name: Credit
  - name: KYC
security:
  - bearerAuth: []
    deviceBinding: []
paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      security: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          description: Registration is awaiting one-time verification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationChallengeResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/register/verify:
    post:
      tags: [Auth]
      operationId: verifyRegistrationChallenge
      security: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRegistrationChallengeRequest'
      responses:
        '201':
          description: User and the empty payment account are created after OTP verification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/otp/challenges:
    post:
      tags: [Auth]
      operationId: createOtpChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOtpChallengeRequest'
      responses:
        '201':
          description: One-time step-up challenge created without returning the OTP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthChallengeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/mfa/methods:
    get:
      tags: [Auth]
      operationId: listMfaMethods
      responses:
        '200':
          description: Active and pending MFA credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaMethodsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/mfa/totp/enroll:
    post:
      tags: [Auth]
      operationId: beginTotpEnrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpEnrollRequest'
      responses:
        '201':
          description: Pending TOTP credential and one-time setup material.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpEnrollmentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/mfa/totp/confirm:
    post:
      tags: [Auth]
      operationId: confirmTotpEnrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpConfirmRequest'
      responses:
        '200':
          description: Active TOTP credential and one-time recovery codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpConfirmationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/mfa/methods/{credentialId}:
    delete:
      tags: [Auth]
      operationId: revokeMfaMethod
      parameters:
        - $ref: '#/components/parameters/CredentialId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurrentPasswordRequest'
      responses:
        '204':
          description: MFA credential revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/mfa/recover:
    post:
      tags: [Auth]
      operationId: startMfaRecovery
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryCodeRequest'
      responses:
        '202':
          description: Recovery code accepted; the account is placed in recovery state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryStartedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/mfa/recover/verify:
    post:
      tags: [Auth]
      operationId: verifyMfaRecovery
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryCodeRequest'
      responses:
        '202':
          description: Recovery code accepted; the account is placed in recovery state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryStartedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/mfa/recover/complete:
    post:
      tags: [Auth]
      operationId: completeMfaRecovery
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryCompletionRequest'
      responses:
        '202':
          description: Recovery completion is accepted by the reference recovery state machine.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCompletionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/mfa/recover/enroll:
    post:
      tags: [Auth]
      operationId: beginRecoveryTotpEnrollment
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryEnrollmentRequest'
      responses:
        '201':
          description: Replacement TOTP setup material after recovery cooldown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpEnrollmentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/challenges/{challengeId}/resend:
    post:
      tags: [Auth]
      operationId: resendVerificationChallenge
      security: []
      parameters:
        - $ref: '#/components/parameters/ChallengeId'
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: New registration email OTP challenge. The old challenge is cancelled; the destination is resolved server-side.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationChallengeResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      security: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Rotated access and refresh token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/verify:
    post:
      tags: [Auth]
      operationId: verifyLoginChallenge
      deprecated: true
      description: Legacy reference-sandbox endpoint. Relational-v2 login is password-only and never calls this endpoint.
      security: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyAuthChallengeRequest'
      responses:
        '200':
          description: Authenticated session after the additional factor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: revokeSession
      security: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Refresh-token family revoked; operation is idempotent.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout-all:
    post:
      tags: [Auth]
      operationId: revokeAllSessions
      responses:
        '204':
          description: All sessions owned by the authenticated user were revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /mobile/control-policy:
    get:
      tags: [Control]
      operationId: getControlPolicy
      responses:
        '200':
          description: Server-controlled pilot and kill-switch policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlPolicy'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      responses:
        '200':
          description: Notifications visible to the authenticated customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /notifications/{notificationId}/read:
    post:
      tags: [Notifications]
      operationId: markNotificationRead
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: Notification marked as read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /fraud-reports:
    post:
      tags: [Fraud]
      operationId: submitFraudReport
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FraudReportRequest'
      responses:
        '201':
          description: Fraud report accepted for risk review, or the matching open report reused idempotently.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FraudReportResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /fraud-reports/{reportId}:
    get:
      tags: [Fraud]
      operationId: getFraudReport
      parameters:
        - name: reportId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current server-authoritative fraud report status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FraudReportResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /accounts:
    get:
      tags: [Accounts]
      operationId: listAccounts
      responses:
        '200':
          description: Accounts visible to the authenticated customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /internal-recipients/lookup:
    post:
      tags: [Recipients]
      operationId: lookupInternalRecipient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalRecipientLookupRequest'
      responses:
        '200':
          description: Short-lived recipient confirmation data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalRecipientLookupResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
  /accounts/{accountId}/number:
    get:
      tags: [Accounts]
      operationId: revealAccountNumber
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Full payment account number for the authenticated account owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountNumberResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /accounts/{accountId}/transactions:
    get:
      tags: [Accounts]
      operationId: listTransactions
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Cursor-paginated transaction history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /accounts/{accountId}/transactions/{transactionId}:
    get:
      tags: [Accounts]
      operationId: getTransactionDetail
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: Transaction detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /beneficiaries/{beneficiaryId}:
    parameters:
      - $ref: '#/components/parameters/BeneficiaryId'
    get:
      tags: [Transfers]
      operationId: lookupBeneficiary
      responses:
        '200':
          description: Beneficiary lookup result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Transfers]
      operationId: renameBeneficiary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameBeneficiaryRequest'
      responses:
        '200':
          description: Beneficiary with the updated display name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Transfers]
      operationId: deleteBeneficiary
      responses:
        '204':
          description: Beneficiary removed from the authenticated customer's directory.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /beneficiaries:
    get:
      tags: [Transfers]
      operationId: listBeneficiaries
      responses:
        '200':
          description: Beneficiaries visible to the authenticated customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiariesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Transfers]
      operationId: createBeneficiary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBeneficiaryRequest'
      responses:
        '201':
          description: Beneficiary created; raw account number is never returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /transfers/quote:
    post:
      tags: [Transfers]
      operationId: quoteTransfer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferQuoteRequest'
      responses:
        '200':
          description: Quote with server-calculated fee and expiry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferQuote'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /transfers:
    post:
      tags: [Transfers]
      operationId: submitTransfer
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitTransferRequest'
      responses:
        '200':
          description: Transfer completed synchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferReceipt'
        '202':
          description: Transfer accepted for asynchronous processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferReceipt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /transfers/{transferId}:
    get:
      tags: [Transfers]
      operationId: getTransfer
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200':
          description: Latest server/core-banking transfer status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferReceipt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /savings/products:
    get:
      tags: [Savings]
      operationId: listSavingsProducts
      responses:
        '200':
          description: Active VND fixed-term savings products in the sandbox.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SavingsProduct' }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /savings/quotes:
    post:
      tags: [Savings]
      operationId: quoteSavings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavingsQuoteRequest'
      responses:
        '200':
          description: Server-calculated immutable rate and maturity snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavingsQuote'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /savings/deposits:
    get:
      tags: [Savings]
      operationId: listSavingsDeposits
      responses:
        '200':
          description: Savings deposits and backend-calculated active principal total.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavingsDepositsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Savings]
      operationId: submitSavingsOpening
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitSavingsOpeningRequest'
      responses:
        '200':
          description: Savings opening completed synchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavingsOpening'
        '202':
          description: Savings opening accepted for asynchronous processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavingsOpening'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /savings/openings/{openingId}:
    get:
      tags: [Savings]
      operationId: getSavingsOpening
      parameters:
        - $ref: '#/components/parameters/SavingsOpeningId'
      responses:
        '200':
          description: Latest savings opening status for resume after timeout or restart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavingsOpening'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /savings/deposits/{depositId}:
    get:
      tags: [Savings]
      operationId: getSavingsDeposit
      parameters:
        - $ref: '#/components/parameters/SavingsDepositId'
      responses:
        '200':
          description: Savings deposit detail with server rate and maturity snapshots.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavingsDeposit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /cards:
    get:
      tags: [Credit]
      operationId: listCreditCards
      responses:
        '200':
          description: Seeded credit card instruments with server-calculated credit summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditCardsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /cards/{cardId}:
    get:
      tags: [Credit]
      operationId: getCreditCard
      parameters:
        - $ref: '#/components/parameters/CardId'
      responses:
        '200':
          description: Credit card, account and latest statement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditCardDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /cards/{cardId}/lock:
    post:
      tags: [Credit]
      operationId: lockCreditCard
      parameters:
        - $ref: '#/components/parameters/CardId'
      responses:
        '200':
          description: Card locked without payment capability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditCardResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /cards/{cardId}/unlock:
    post:
      tags: [Credit]
      operationId: unlockCreditCard
      parameters:
        - $ref: '#/components/parameters/CardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardControlStepUpRequest'
      responses:
        '200':
          description: Card unlocked after sandbox step-up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditCardResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /cards/{cardId}/report-lost:
    post:
      tags: [Credit]
      operationId: reportCreditCardLost
      parameters:
        - $ref: '#/components/parameters/CardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardControlStepUpRequest'
      responses:
        '200':
          description: Card blocked and a single durable reported-lost operations case created or reused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardReportedLostResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /credit/accounts:
    get:
      tags: [Credit]
      operationId: listCreditAccounts
      responses:
        '200':
          description: Credit accounts owned by the authenticated customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditAccountsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /credit/applications:
    get:
      tags: [Credit]
      operationId: listCreditApplications
      responses:
        '200':
          description: Explicit credit applications owned by the customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditApplicationsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Credit]
      operationId: submitCreditApplication
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditApplicationRequest'
      responses:
        '201':
          description: Sandbox application approved but not activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditApplication'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /credit/applications/{applicationId}:
    get:
      tags: [Credit]
      operationId: getCreditApplication
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Credit application status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditApplication'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /credit/applications/{applicationId}/activate:
    post:
      tags: [Credit]
      operationId: activateCreditApplication
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditStepUpRequest'
      responses:
        '200':
          description: Credit product activated after explicit customer confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditApplication'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /credit/accounts/{creditAccountId}:
    get:
      tags: [Credit]
      operationId: getCreditAccount
      parameters:
        - $ref: '#/components/parameters/CreditAccountId'
      responses:
        '200':
          description: Credit account snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /credit/accounts/{creditAccountId}/transactions:
    get:
      tags: [Credit]
      operationId: listCreditTransactions
      parameters:
        - $ref: '#/components/parameters/CreditAccountId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Cursor-paginated credit transactions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditTransactionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /credit/accounts/{creditAccountId}/statements:
    get:
      tags: [Credit]
      operationId: listCreditStatements
      parameters:
        - $ref: '#/components/parameters/CreditAccountId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Cursor-paginated immutable statement snapshots.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditStatementsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /credit/accounts/{creditAccountId}/statements/{statementId}:
    get:
      tags: [Credit]
      operationId: getCreditStatement
      parameters:
        - $ref: '#/components/parameters/CreditAccountId'
        - $ref: '#/components/parameters/StatementId'
      responses:
        '200':
          description: Statement detail with transaction and payment snapshots.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditStatementResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /credit/payment-quotes:
    post:
      tags: [Credit]
      operationId: createCreditPaymentQuote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditPaymentQuoteRequest'
      responses:
        '200':
          description: Server-calculated credit payment quote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditPaymentQuote'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /credit/payments:
    post:
      tags: [Credit]
      operationId: submitCreditPayment
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditPaymentRequest'
      responses:
        '200':
          description: Credit payment completed synchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditPayment'
        '202':
          description: Credit payment accepted for asynchronous processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditPayment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '422':
          $ref: '#/components/responses/ValidationError'
  /credit/payments/{paymentId}:
    get:
      tags: [Credit]
      operationId: getCreditPayment
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: Credit payment status/receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditPayment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /kyc/application:
    get:
      tags: [KYC]
      operationId: getKycApplication
      responses:
        '200':
          description: Latest synthetic KYC application owned by the authenticated customer, or null when none exists. The response exposes only identityNumberLast4, never the full identity number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycApplicationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [KYC]
      operationId: saveKycDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KycApplicationRequest'
      responses:
        '200':
          description: Persisted synthetic KYC draft. A new application requires identityNumber; an update may omit it when the identity is unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycApplicationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /kyc/application/submit:
    post:
      tags: [KYC]
      operationId: submitKycApplication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KycApplicationRequest'
      responses:
        '201':
          description: KYC application submitted for explicit staff review. A new application requires identityNumber; an update may omit it when the identity is unchanged and must send the new full value when it changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycApplicationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    deviceBinding:
      type: apiKey
      in: header
      name: X-Device-ID
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    TransactionId:
      name: transactionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    BeneficiaryId:
      name: beneficiaryId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    TransferId:
      name: transferId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    SavingsOpeningId:
      name: openingId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    SavingsDepositId:
      name: depositId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    CardId:
      name: cardId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CreditAccountId:
      name: creditAccountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StatementId:
      name: statementId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
    DeviceId:
      name: X-Device-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
    ChallengeId:
      name: challengeId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    CredentialId:
      name: credentialId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Access token missing, expired or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorPayload'
    Conflict:
      description: Resource, idempotency, credential or financial step-up business conflict. `STEP_UP_VERIFICATION_FAILED` never means the bearer token is invalid and must not trigger token refresh/replay.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorPayload'
    RateLimited:
      description: Too many requests.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorPayload'
    NotFound:
      description: Resource not found or not visible to the customer.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorPayload'
    ValidationError:
      description: Request validation or business rule failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorPayload'
    ServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorPayload'
  schemas:
    ApiErrorPayload:
      type: object
      required: [code, message, fieldErrors, traceId]
      properties:
        code:
          type: string
        message:
          type: string
        fieldErrors:
          oneOf:
            - type: object
              additionalProperties:
                type: string
            - type: 'null'
        traceId:
          type: string
    AuthUser:
      type: object
      required: [id, fullName, email, phoneNumber, createdAt]
      properties:
        id: { type: string }
        fullName: { type: string }
        email: { type: string, format: email }
        phoneNumber: { type: string }
        createdAt: { type: string, format: date-time }
    RegisterRequest:
      type: object
      required: [fullName, email, phoneNumber, password]
      example:
        fullName: Example User
        email: tester@example.com
        phoneNumber: '0900000000'
        password: <provided-by-test-secret>
      properties:
        fullName: { type: string, minLength: 1 }
        email: { type: string, format: email }
        phoneNumber: { type: string, minLength: 1 }
        password: { type: string, minLength: 8, writeOnly: true }
    RegisterResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/AuthUser' }
    LoginRequest:
      type: object
      required: [email, password]
      example:
        email: tester@example.com
        password: <provided-by-test-secret>
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, writeOnly: true }
    LoginResponse:
      type: object
      required: [accessToken, refreshToken, expiresInSeconds, user]
      properties:
        accessToken: { type: string, writeOnly: true }
        refreshToken: { type: string, writeOnly: true }
        expiresInSeconds: { type: integer, exclusiveMinimum: 0 }
        user: { $ref: '#/components/schemas/AuthUser' }
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 1, writeOnly: true }
    RefreshTokenResponse:
      allOf:
        - $ref: '#/components/schemas/LoginResponse'
    AuthChallengeResponse:
      type: object
      required: [challengeId, expiresAt, methods, purpose]
      properties:
        challengeId: { type: string, minLength: 1 }
        expiresAt: { type: string, format: date-time }
        purpose: { type: string, enum: [REGISTRATION_VERIFY, REGISTRATION_EMAIL_VERIFY, LOGIN, TRANSFER, SAVINGS_OPENING, CREDIT_APPLICATION, CARD_ACTIVATION, CREDIT_PAYMENT, CARD_UNLOCK, CARD_REPORT_LOST, RECOVERY_CODE_ROTATION, MFA_FACTOR_CHANGE, MFA_FACTOR_REMOVAL] }
        methods:
          type: array
          minItems: 1
          items: { type: string, enum: [OTP, EMAIL_OTP, TOTP] }
        method: { type: string, enum: [EMAIL_OTP, TOTP] }
        resendAfter: { type: string, format: date-time }
        maskedDestination: { type: string }
    RegistrationChallengeResponse:
      type: object
      required: [challengeId, expiresAt, methods, method, purpose, resendAfter, maskedDestination]
      properties:
        challengeId: { type: string, minLength: 1 }
        expiresAt: { type: string, format: date-time }
        methods:
          type: array
          minItems: 1
          maxItems: 1
          items: { type: string, enum: [EMAIL_OTP] }
        method: { type: string, enum: [EMAIL_OTP] }
        purpose: { type: string, enum: [REGISTRATION_EMAIL_VERIFY] }
        resendAfter: { type: string, format: date-time }
        maskedDestination: { type: string, minLength: 1 }
    MfaChallengeResponse:
      type: object
      required: [challengeId, method, methods, purpose, expiresAt]
      properties:
        challengeId: { type: string, minLength: 1 }
        method: { type: string, enum: [EMAIL_OTP, TOTP] }
        methods:
          type: array
          minItems: 1
          maxItems: 1
          items: { type: string, enum: [EMAIL_OTP, TOTP] }
        purpose: { type: string }
        expiresAt: { type: string, format: date-time }
        resendAfter: { type: string, format: date-time }
        maskedDestination: { type: string }
    MfaCredential:
      type: object
      required: [id, customerId, credentialType, displayName, status]
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        credentialType: { type: string, enum: [TOTP, PASSKEY, OOB_SMS] }
        displayName: { type: string }
        status: { type: string, enum: [PENDING, ACTIVE, SUSPENDED, REVOKED] }
        algorithm: { type: string }
        digits: { type: integer }
        periodSeconds: { type: integer }
    MfaMethodsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MfaCredential' }
    TotpEnrollRequest:
      type: object
      required: [password]
      example:
        password: <provided-by-test-secret>
        displayName: Personal authenticator
      properties:
        password: { type: string, minLength: 8, writeOnly: true }
        displayName: { type: string, minLength: 1, maxLength: 80 }
        challengeId: { type: string, minLength: 1 }
        code: { type: string, pattern: '^\d{6}$', writeOnly: true }
    TotpEnrollmentResponse:
      type: object
      required: [credentialId, status, expiresAt, manualSetupKey, otpauthUri]
      properties:
        credentialId: { type: string, format: uuid }
        status: { type: string, enum: [PENDING] }
        expiresAt: { type: string, format: date-time }
        manualSetupKey: { type: string, writeOnly: true }
        otpauthUri: { type: string, writeOnly: true }
    TotpConfirmRequest:
      type: object
      required: [credentialId, code]
      properties:
        credentialId: { type: string, format: uuid }
        code: { type: string, pattern: '^\d{6}$', writeOnly: true }
        recoveryToken: { type: string, minLength: 1, writeOnly: true }
    TotpConfirmationResponse:
      type: object
      required: [credentialId, status, recoveryCodes]
      properties:
        credentialId: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE] }
        recoveryCodes:
          type: array
          minItems: 8
          maxItems: 10
          writeOnly: true
          items: { type: string, writeOnly: true }
    RecoveryCodeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 16, writeOnly: true }
        recoveryToken: { type: string, minLength: 1, writeOnly: true }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, writeOnly: true }
    RecoveryCompletionRequest:
      type: object
      required: [recoveryToken]
      properties:
        recoveryToken: { type: string, minLength: 1, writeOnly: true }
    RecoveryCompletionResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [RECOVERY_COMPLETED] }
    RecoveryEnrollmentRequest:
      type: object
      required: [recoveryToken]
      properties:
        recoveryToken: { type: string, minLength: 1, writeOnly: true }
        displayName: { type: string, minLength: 1, maxLength: 80 }
    RecoveryStartedResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [RECOVERY_STARTED] }
        recoveryRequestId: { type: string, format: uuid }
        recoveryToken: { type: string, writeOnly: true }
        cooldownUntil: { type: string, format: date-time }
    CurrentPasswordRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 8, writeOnly: true }
        challengeId: { type: string, minLength: 1 }
        code: { type: string, pattern: '^\d{6}$', writeOnly: true }
    CreateOtpChallengeRequest:
      type: object
      required: [purpose]
      example:
        purpose: TRANSFER
        resourceId: quote-example
        requestFingerprint: fingerprint-example
      properties:
        purpose: { type: string, enum: [TRANSFER, SAVINGS_OPENING, CREDIT_APPLICATION, CARD_ACTIVATION, CREDIT_PAYMENT, CARD_UNLOCK, CARD_REPORT_LOST, RECOVERY_CODE_ROTATION, MFA_FACTOR_CHANGE, MFA_FACTOR_REMOVAL] }
        resourceId:
          oneOf:
            - { type: string }
            - { type: 'null' }
        requestFingerprint:
          oneOf:
            - { type: string }
            - { type: 'null' }
    FundingReceipt:
      type: object
      required: [fundingId, reference, status, amount, transactionId, recipientMaskedAccountNumber, createdAt]
      properties:
        fundingId: { type: string }
        reference: { type: string }
        status: { type: string, enum: [SUCCEEDED] }
        amount: { $ref: '#/components/schemas/Money' }
        transactionId: { type: string }
        recipientMaskedAccountNumber: { type: string }
        createdAt: { type: string, format: date-time }
    InternalRecipientLookupRequest:
      type: object
      required: [accountNumber]
      properties:
        accountNumber: { type: string, pattern: '^\d{6,34}$', writeOnly: true }
    InternalRecipientLookup:
      type: object
      required: [lookupId, accountHolderName, maskedAccountNumber, bankName, status, expiresAt]
      properties:
        lookupId: { type: string }
        accountHolderName: { type: string }
        maskedAccountNumber: { type: string }
        bankName: { type: string }
        status: { type: string, enum: [ACTIVE, BLOCKED] }
        expiresAt: { type: string, format: date-time }
    InternalRecipientLookupResponse:
      type: object
      required: [recipient]
      properties:
        recipient: { $ref: '#/components/schemas/InternalRecipientLookup' }
    VerifyAuthChallengeRequest:
      type: object
      required: [challengeId, method, proof]
      example:
        challengeId: challenge-example
        method: OTP
        proof: <provided-by-test-factor>
      properties:
        challengeId: { type: string, minLength: 1, writeOnly: true }
        method: { type: string, enum: [OTP, EMAIL_OTP, TOTP] }
        proof: { type: string, minLength: 1, writeOnly: true }
    VerifyRegistrationChallengeRequest:
      type: object
      required: [challengeId, method, proof]
      example:
        challengeId: challenge-example
        method: EMAIL_OTP
        proof: <provided-by-test-factor>
      properties:
        challengeId: { type: string, minLength: 1, writeOnly: true }
        method: { type: string, enum: [EMAIL_OTP] }
        proof: { type: string, minLength: 1, writeOnly: true }
    LogoutRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 1, writeOnly: true }
    ControlPolicy:
      type: object

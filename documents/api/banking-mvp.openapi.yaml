        version: { type: integer, minimum: 1 }
        items:
          type: array
          items: { $ref: '#/components/schemas/CreditTransaction' }
        payments:
          type: array
          items: { $ref: '#/components/schemas/CreditPayment' }
    CreditStatementResponse:
      type: object
      required: [statement]
      properties:
        statement: { $ref: '#/components/schemas/CreditStatement' }
    CreditStatementsResponse:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CreditStatement' }
        nextCursor:
          oneOf:
            - { type: string }
            - { type: 'null' }
    CreditPaymentQuoteRequest:
      type: object
      required: [sourceAccountId, creditAccountId, statementId, paymentOption]
      example:
        sourceAccountId: account-example
        creditAccountId: credit-account-example
        statementId: statement-example
        paymentOption: MINIMUM
      properties:
        sourceAccountId: { type: string, format: uuid }
        creditAccountId: { type: string, format: uuid }
        statementId: { type: string, format: uuid }
        paymentOption: { type: string, enum: [MINIMUM, FULL_STATEMENT, CUSTOM] }
        amount:
          oneOf:
            - { $ref: '#/components/schemas/Money' }
            - { type: 'null' }
    CreditPaymentQuote:
      type: object
      required: [quoteId, sourceAccountId, sourceAccountMaskedNumber, creditAccountId, cardLastFour, statementId, statementVersion, paymentOption, amount, fee, outstandingBefore, outstandingAfter, minimumPaymentRemainingBefore, minimumPaymentRemainingAfter, terms, expiresAt]
      properties:
        quoteId: { type: string, format: uuid }
        sourceAccountId: { type: string, format: uuid }
        sourceAccountMaskedNumber: { type: string }
        creditAccountId: { type: string, format: uuid }
        cardLastFour: { type: string, pattern: '^\d{4}$' }
        statementId: { type: string, format: uuid }
        statementVersion: { type: integer, minimum: 1 }
        paymentOption: { type: string, enum: [MINIMUM, FULL_STATEMENT, CUSTOM] }
        amount: { $ref: '#/components/schemas/Money' }
        fee: { $ref: '#/components/schemas/Money' }
        outstandingBefore: { $ref: '#/components/schemas/Money' }
        outstandingAfter: { $ref: '#/components/schemas/Money' }
        minimumPaymentRemainingBefore: { $ref: '#/components/schemas/Money' }
        minimumPaymentRemainingAfter: { $ref: '#/components/schemas/Money' }
        terms: { type: string }
        expiresAt: { type: string, format: date-time }
    CreditPaymentRequest:
      type: object
      required: [quoteId, stepUp]
      example:
        quoteId: credit-quote-example
        stepUp:
          method: OTP
          proof: <provided-by-test-factor>
          challengeId: challenge-example
      properties:
        quoteId: { type: string, format: uuid }
        stepUp: { $ref: '#/components/schemas/CreditStepUpRequest' }

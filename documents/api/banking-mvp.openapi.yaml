  /kyc/application:
    get:
      tags: [KYC]
      operationId: getKycApplication
      responses:
        '200':
          description: Latest synthetic KYC application owned by the authenticated customer, or null when none exists. The response exposes only identityNumberLast4, never the full identity number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycApplicationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [KYC]
      operationId: saveKycDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KycApplicationRequest'
      responses:
        '200':
          description: Persisted synthetic KYC draft. A new application requires identityNumber; an update may omit it when the identity is unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycApplicationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /kyc/application/submit:
    post:
      tags: [KYC]
      operationId: submitKycApplication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KycApplicationRequest'
      responses:
        '201':
          description: KYC application submitted for explicit staff review. A new application requires identityNumber; an update may omit it when the identity is unchanged and must send the new full value when it changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycApplicationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /assistant/help:
    post:
      tags: [Assistant]
      operationId: getAssistantHelp
      security:
        - bearerAuth: []
          deviceBinding: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantHelpRequest'
      responses:
        '200':
          description: Assistant help response with answer text.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantHelpResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /assistant/financial-advice:
    post:
      tags: [Assistant]
      operationId: getFinancialAdvice
      security:
        - bearerAuth: []
          deviceBinding: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinancialAdviceRequest'
      responses:
        '200':
          description: Financial advice evaluation response with metrics, options and explanation.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialAdviceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    deviceBinding:
      type: apiKey
      in: header
      name: X-Device-ID
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    TransactionId:
      name: transactionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    BeneficiaryId:
      name: beneficiaryId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    TransferId:
      name: transferId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    SavingsOpeningId:
      name: openingId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    SavingsDepositId:
      name: depositId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    CardId:
      name: cardId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CreditAccountId:
      name: creditAccountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StatementId:
      name: statementId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
    DeviceId:
      name: X-Device-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
    ChallengeId:
      name: challengeId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    CredentialId:
      name: credentialId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Access token missing, expired or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorPayload'
    Conflict:
      description: Resource, idempotency, credential or financial step-up business conflict. `STEP_UP_VERIFICATION_FAILED` never means the bearer token is invalid and must not trigger token refresh/replay.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorPayload'
    RateLimited:
      description: Too many requests.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorPayload'
    NotFound:
      description: Resource not found or not visible to the customer.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorPayload'
    ValidationError:
      description: Request validation or business rule failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorPayload'
    ServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorPayload'
    UnsupportedMediaType:
      description: Content-Type must be application/json.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorPayload'
    BadGateway:
      description: Assistant AI provider error or invalid output.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorPayload'
    ServiceUnavailable:
      description: Assistant help service is currently unavailable or disabled.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorPayload'
    GatewayTimeout:
      description: Assistant service request or provider timed out.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorPayload'
    PayloadTooLarge:
      description: Request payload exceeds maximum allowable size.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorPayload'
  schemas:
    ApiErrorPayload:
      type: object
      required: [code, message, fieldErrors, traceId]
      properties:
        code:
          type: string
        message:
          type: string
        fieldErrors:
          oneOf:
            - type: object
              additionalProperties:
                type: string
            - type: 'null'
        traceId:
          type: string
    AuthUser:
      type: object
      required: [id, fullName, email, phoneNumber, createdAt]
      properties:
        id: { type: string }
        fullName: { type: string }
        email: { type: string, format: email }
        phoneNumber: { type: string }
        createdAt: { type: string, format: date-time }
    RegisterRequest:
      type: object
      required: [fullName, email, phoneNumber, password]
      example:
        fullName: Example User
        email: tester@example.com
        phoneNumber: '0900000000'
        password: <provided-by-test-secret>
      properties:
        fullName: { type: string, minLength: 1 }
        email: { type: string, format: email }
        phoneNumber: { type: string, minLength: 1 }
        password: { type: string, minLength: 8, writeOnly: true }
    RegisterResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/AuthUser' }
    LoginRequest:
      type: object
      required: [email, password]
      example:
        email: tester@example.com
        password: <provided-by-test-secret>
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, writeOnly: true }
    LoginResponse:
      type: object
      required: [accessToken, refreshToken, expiresInSeconds, user]
      properties:
        accessToken: { type: string, writeOnly: true }
        refreshToken: { type: string, writeOnly: true }
        expiresInSeconds: { type: integer, exclusiveMinimum: 0 }
        user: { $ref: '#/components/schemas/AuthUser' }
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 1, writeOnly: true }
    RefreshTokenResponse:
      allOf:
        - $ref: '#/components/schemas/LoginResponse'
    AuthChallengeResponse:
      type: object
      required: [challengeId, expiresAt, methods, purpose]
      properties:
        challengeId: { type: string, minLength: 1 }
        expiresAt: { type: string, format: date-time }
        purpose: { type: string, enum: [REGISTRATION_VERIFY, REGISTRATION_EMAIL_VERIFY, LOGIN, TRANSFER, SAVINGS_OPENING, CREDIT_APPLICATION, CARD_ACTIVATION, CREDIT_PAYMENT, CARD_UNLOCK, CARD_REPORT_LOST, RECOVERY_CODE_ROTATION, MFA_FACTOR_CHANGE, MFA_FACTOR_REMOVAL] }
        methods:
          type: array
          minItems: 1
          items: { type: string, enum: [OTP, EMAIL_OTP, TOTP] }
        method: { type: string, enum: [EMAIL_OTP, TOTP] }
        resendAfter: { type: string, format: date-time }
        maskedDestination: { type: string }
    RegistrationChallengeResponse:
      type: object
      required: [challengeId, expiresAt, methods, method, purpose, resendAfter, maskedDestination]
      properties:
        challengeId: { type: string, minLength: 1 }
        expiresAt: { type: string, format: date-time }
        methods:
          type: array
          minItems: 1
          maxItems: 1
          items: { type: string, enum: [EMAIL_OTP] }
        method: { type: string, enum: [EMAIL_OTP] }
        purpose: { type: string, enum: [REGISTRATION_EMAIL_VERIFY] }
        resendAfter: { type: string, format: date-time }
        maskedDestination: { type: string, minLength: 1 }
    MfaChallengeResponse:
      type: object
      required: [challengeId, method, methods, purpose, expiresAt]
      properties:
        challengeId: { type: string, minLength: 1 }
        method: { type: string, enum: [EMAIL_OTP, TOTP] }
        methods:
          type: array
          minItems: 1
          maxItems: 1
          items: { type: string, enum: [EMAIL_OTP, TOTP] }
        purpose: { type: string }
        expiresAt: { type: string, format: date-time }
        resendAfter: { type: string, format: date-time }
        maskedDestination: { type: string }
    MfaCredential:
      type: object
      required: [id, customerId, credentialType, displayName, status]
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        credentialType: { type: string, enum: [TOTP, PASSKEY, OOB_SMS] }
        displayName: { type: string }
        status: { type: string, enum: [PENDING, ACTIVE, SUSPENDED, REVOKED] }
        algorithm: { type: string }
        digits: { type: integer }
        periodSeconds: { type: integer }
    MfaMethodsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MfaCredential' }
    TotpEnrollRequest:
      type: object
      required: [password]
      example:
        password: <provided-by-test-secret>
        displayName: Personal authenticator
      properties:
        password: { type: string, minLength: 8, writeOnly: true }
        displayName: { type: string, minLength: 1, maxLength: 80 }
        challengeId: { type: string, minLength: 1 }
        code: { type: string, pattern: '^\d{6}$', writeOnly: true }
    TotpEnrollmentResponse:
      type: object

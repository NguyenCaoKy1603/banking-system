        description: { type: string }
        changes:
          type: object
          additionalProperties: false
          maxProperties: 0
    FinancialAdviceExplanation:
      type: object
      required: [mode, reasonIds, paragraphs, fallbackReason]
      additionalProperties: false
      properties:
        mode: { type: string, enum: [AI_ASSISTED, RULE_BASED] }
        reasonIds:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            enum: [TARGET_ALREADY_FUNDED, MONTHLY_GAP, GOAL_FEASIBLE, BUDGET_TARGET_MET, BASE_BUDGET_DEFICIT, BUFFER_NOT_COVERED, NO_SAVING_CAPACITY, PRESERVE_CURRENT_SPENDING, KEEP_TARGET_WITH_FLEXIBLE_CUT, ADJUST_GOAL_TO_CAPACITY, EXTEND_TIME_TO_CAPACITY, REVIEW_DECLARED_INPUTS]
        paragraphs: { type: array, minItems: 1, items: { type: string } }
        fallbackReason:
          type: [string, "null"]
          enum: [AI_DISABLED, PROVIDER_UNAVAILABLE, PROVIDER_TIMEOUT, PROVIDER_INVALID_OUTPUT, PROVIDER_BUDGET_EXHAUSTED, null]
    FinancialAdviceWarning:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code: { type: string, enum: [BASE_BUDGET_DEFICIT, BUFFER_NOT_COVERED] }
        message: { type: string }

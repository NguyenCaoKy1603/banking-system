openapi: 3.1.0
info:
  title: Banking MVP Accounts and Transfers API
  version: 0.2.0-draft
  description: |
    DRAFT only. This contract requires backend, core-banking partner and
    legal/compliance approval before any real-money pilot. Authenticated
    operations also require X-Device-ID for device binding.
servers:
  - url: https://api.example.invalid/api/v1
    description: Placeholder; replace through approved environment configuration.
tags:
  - name: Auth
  - name: Control
  - name: Notifications
  - name: Fraud
  - name: Sandbox
  - name: Recipients
  - name: Accounts
  - name: Transfers
  - name: Savings
  - name: Credit
  - name: KYC
  - name: Assistant
security:
  - bearerAuth: []
    deviceBinding: []
paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      security: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          description: Registration is awaiting one-time verification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationChallengeResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/register/verify:
    post:
      tags: [Auth]
      operationId: verifyRegistrationChallenge
      security: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRegistrationChallengeRequest'
      responses:
        '201':
          description: User and the empty payment account are created after OTP verification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/register/cancel:
    post:
      tags: [Auth]
      operationId: cancelRegistrationChallenge
      security: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelChallengeRequest'
      responses:
        '204':
          description: Registration challenge was successfully cancelled or was already terminal.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/otp/challenges:
    post:
      tags: [Auth]
      operationId: createOtpChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOtpChallengeRequest'
      responses:
        '201':
          description: One-time step-up challenge created without returning the OTP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthChallengeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/mfa/methods:
    get:
      tags: [Auth]
      operationId: listMfaMethods
      responses:
        '200':
          description: Active and pending MFA credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaMethodsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/mfa/totp/enroll:
    post:
      tags: [Auth]
      operationId: beginTotpEnrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpEnrollRequest'
      responses:
        '201':
          description: Pending TOTP credential and one-time setup material.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpEnrollmentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/mfa/totp/confirm:
    post:
      tags: [Auth]
      operationId: confirmTotpEnrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpConfirmRequest'
      responses:
        '200':
          description: Active TOTP credential and one-time recovery codes. Revokes all active customer sessions upon successful confirmation. Supports Bearer auth with device binding, or unauthenticated recovery confirmation with recoveryToken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpConfirmationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/mfa/methods/{credentialId}:
    delete:
      tags: [Auth]
      operationId: revokeMfaMethod
      parameters:
        - $ref: '#/components/parameters/CredentialId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurrentPasswordRequest'
      responses:
        '204':
          description: MFA credential revoked. Revokes all active customer sessions.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/mfa/recover:
    post:
      tags: [Auth]
      operationId: startMfaRecovery
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryCodeRequest'
      responses:
        '202':
          description: Recovery code accepted; the account is placed in recovery state. All active sessions are revoked. The recovery token expires at cooldownUntil + 15 minutes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryStartedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/mfa/recover/verify:
    post:
      tags: [Auth]
      operationId: verifyMfaRecovery
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryCodeRequest'
      responses:
        '202':
          description: Recovery code accepted; the account is placed in recovery state. All active sessions are revoked. The recovery token expires at cooldownUntil + 15 minutes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryStartedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/mfa/recover/complete:
    post:
      tags: [Auth]
      operationId: completeMfaRecovery
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryCompletionRequest'
      responses:
        '202':
          description: Recovery completion is accepted by the reference recovery state machine.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCompletionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Recovery request is either in cooldown period or has already been completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                cooldown:
                  value:
                    code: MFA_RECOVERY_COOLDOWN
                    message: MFA recovery is still in its cooldown period.
                alreadyCompleted:
                  value:
                    code: MFA_RECOVERY_ALREADY_COMPLETED
                    message: MFA recovery request has already been completed.
  /auth/mfa/recover/enroll:
    post:
      tags: [Auth]
      operationId: beginRecoveryTotpEnrollment
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryEnrollmentRequest'
      responses:
        '201':
          description: Replacement TOTP setup material after recovery cooldown. Requires recovery request status COMPLETED before expiresAt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpEnrollmentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/mfa/recovery-codes/rotate:
    post:
      tags: [Auth]
      operationId: rotateRecoveryCodes
      summary: Rotate MFA recovery codes
      description: Generates a new batch of 10 recovery codes, revokes all old recovery codes, and revokes all active customer sessions. Requires step-up challenge proof with purpose RECOVERY_CODE_ROTATION.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryCodesRotateRequest'
      responses:
        '200':
          description: Recovery codes rotated successfully and all active sessions revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodesRotateResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/challenges/{challengeId}/resend:
    post:
      tags: [Auth]
      operationId: resendVerificationChallenge
      security: []
      parameters:
        - $ref: '#/components/parameters/ChallengeId'
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: New registration email OTP challenge. The old challenge is cancelled; the destination is resolved server-side.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationChallengeResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      security: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Rotated access and refresh token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/verify:
    post:
      tags: [Auth]
      operationId: verifyLoginChallenge
      deprecated: true
      description: Legacy reference-sandbox endpoint. Relational-v2 login is password-only and never calls this endpoint.
      security: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyAuthChallengeRequest'
      responses:
        '200':
          description: Authenticated session after the additional factor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: revokeSession
      security: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Refresh-token family revoked; operation is idempotent.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout-all:
    post:
      tags: [Auth]
      operationId: revokeAllSessions
      responses:
        '204':
          description: All sessions owned by the authenticated user were revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /mobile/control-policy:
    get:
      tags: [Control]
      operationId: getControlPolicy
      responses:
        '200':
          description: Server-controlled pilot and kill-switch policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlPolicy'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      responses:
        '200':
          description: Notifications visible to the authenticated customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /notifications/{notificationId}/read:
    post:
      tags: [Notifications]
      operationId: markNotificationRead
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: Notification marked as read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /fraud-reports:
    post:
      tags: [Fraud]
      operationId: submitFraudReport
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FraudReportRequest'
      responses:
        '201':
          description: Fraud report accepted for risk review, or the matching open report reused idempotently.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FraudReportResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /fraud-reports/{reportId}:
    get:
      tags: [Fraud]
      operationId: getFraudReport
      parameters:
        - name: reportId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current server-authoritative fraud report status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FraudReportResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /accounts:
    get:
      tags: [Accounts]
      operationId: listAccounts
      responses:
        '200':
          description: Accounts visible to the authenticated customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /internal-recipients/lookup:
    post:
      tags: [Recipients]
      operationId: lookupInternalRecipient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalRecipientLookupRequest'
      responses:
        '200':
          description: Short-lived recipient confirmation data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalRecipientLookupResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
  /accounts/{accountId}/number:
    get:
      tags: [Accounts]
      operationId: revealAccountNumber
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Full payment account number for the authenticated account owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountNumberResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /accounts/{accountId}/transactions:
    get:
      tags: [Accounts]
      operationId: listTransactions
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Cursor-paginated transaction history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /accounts/{accountId}/transactions/{transactionId}:
    get:
      tags: [Accounts]
      operationId: getTransactionDetail
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: Transaction detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /beneficiaries/{beneficiaryId}:
    parameters:
      - $ref: '#/components/parameters/BeneficiaryId'
    get:
      tags: [Transfers]
      operationId: lookupBeneficiary
      responses:
        '200':
          description: Beneficiary lookup result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Transfers]
      operationId: renameBeneficiary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameBeneficiaryRequest'
      responses:
        '200':
          description: Beneficiary with the updated display name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Transfers]
      operationId: deleteBeneficiary
      responses:
        '204':
          description: Beneficiary removed from the authenticated customer's directory.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /beneficiaries:
    get:
      tags: [Transfers]
      operationId: listBeneficiaries
      responses:
        '200':
          description: Beneficiaries visible to the authenticated customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiariesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Transfers]
      operationId: createBeneficiary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBeneficiaryRequest'
      responses:
        '201':
          description: Beneficiary created; raw account number is never returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /transfers/quote:
    post:
      tags: [Transfers]
      operationId: quoteTransfer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferQuoteRequest'
      responses:
        '200':
          description: Quote with server-calculated fee and expiry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferQuote'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /transfers:
    post:
      tags: [Transfers]
      operationId: submitTransfer
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitTransferRequest'
      responses:
        '200':
          description: Transfer completed synchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferReceipt'
        '202':
          description: Transfer accepted for asynchronous processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferReceipt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /transfers/{transferId}:
    get:
      tags: [Transfers]
      operationId: getTransfer
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200':
          description: Latest server/core-banking transfer status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferReceipt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /savings/products:
    get:
      tags: [Savings]
      operationId: listSavingsProducts
      responses:
        '200':
          description: Active VND fixed-term savings products in the sandbox.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SavingsProduct' }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /savings/quotes:
    post:
      tags: [Savings]
      operationId: quoteSavings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavingsQuoteRequest'
      responses:
        '200':
          description: Server-calculated immutable rate and maturity snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavingsQuote'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /savings/deposits:
    get:
      tags: [Savings]
      operationId: listSavingsDeposits
      responses:
        '200':
          description: Savings deposits and backend-calculated active principal total.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavingsDepositsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Savings]
      operationId: submitSavingsOpening
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitSavingsOpeningRequest'
      responses:
        '200':
          description: Savings opening completed synchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavingsOpening'
        '202':
          description: Savings opening accepted for asynchronous processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavingsOpening'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /savings/openings/{openingId}:
    get:
      tags: [Savings]

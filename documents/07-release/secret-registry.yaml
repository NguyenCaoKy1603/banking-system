# Metadata-only registry. Never add secret values here.
version: 1
environments:
  development:
    provider: local
    namespace: banking/development
  staging:
    provider: managed
    namespace: banking/staging
  production-like:
    provider: managed
    namespace: banking/production-like
secrets:
  - secretId: database-credential
    purpose: postgres-connection
    services: [backend-api, admin-api, outbox-worker, migrator]
    rotation: 30-60d
    owner: academic-staging-owner
    binding: { mode: managed-mount, target: backend-api|admin-api|outbox-worker; migrator-provider-environment }
    version: { slot: single, source: provider-assigned, firstDeployment: required-at-startup }
    lifecycle: { initialState: PREPARED, rotate: version-and-rollout, retire: owner-approval-after-connection-check }
  - secretId: otp-pepper
    purpose: otp-digest
    services: [backend-api]
    rotation: 90d
    owner: backend-owner
    binding: { mode: managed-mount, target: backend-api }
    version: { slot: current, source: provider-assigned, firstDeployment: required-at-startup }
    lifecycle: { initialState: PREPARED, rotate: move-current-to-previous-and-rollout, retire: after-old-challenges-expire }
  - secretId: otp-pepper-previous
    purpose: otp-digest-previous-keyring
    services: [backend-api]
    rotation: 90d
    owner: backend-owner
    binding: { mode: managed-mount, target: backend-api }
    version: { slot: previous, source: provider-assigned, firstDeployment: prepared-previous-required }
    lifecycle: { initialState: PREPARED, rotate: replace-with-former-current, retire: after-old-challenges-expire-and-owner-approval }
  - secretId: mfa-encryption-key
    purpose: mfa-totp
    services: [backend-api, admin-api]
    rotation: 6-12m
    owner: backend-owner
    binding: { mode: managed-mount, target: backend-api|admin-api }
    version: { slot: current, source: provider-assigned, firstDeployment: required-at-startup }
    lifecycle: { initialState: PREPARED, rotate: move-current-to-previous-and-rollout, retire: after-ciphertext-reencryption }
  - secretId: mfa-encryption-key-previous
    purpose: mfa-totp-previous-keyring
    services: [backend-api, admin-api]
    rotation: 6-12m
    owner: backend-owner
    binding: { mode: managed-mount, target: backend-api|admin-api }
    version: { slot: previous, source: provider-assigned, firstDeployment: prepared-previous-required }
    lifecycle: { initialState: PREPARED, rotate: replace-with-former-current, retire: after-ciphertext-reencryption-and-owner-approval }
  - secretId: email-provider-token
    purpose: email-delivery
    services: [backend-api]
    rotation: 90d
    owner: backend-owner
    binding: { mode: managed-mount, target: backend-api; required-when-email-provider-enabled }
    version: { slot: single, source: provider-assigned, firstDeployment: required-when-enabled }
    lifecycle: { initialState: PREPARED, rotate: update-provider-version-and-rollout, retire: after-delivery-health-check }
  - secretId: notification-endpoint-key
    purpose: notification-endpoint
    services: [outbox-worker]
    rotation: 6-12m
    owner: worker-owner
    binding: { mode: managed-mount, target: outbox-worker }
    version: { slot: current, source: provider-assigned, firstDeployment: required-when-enabled }
    lifecycle: { initialState: PREPARED, rotate: move-current-to-previous-and-rollout, retire: after-endpoint-reencryption }
  - secretId: notification-endpoint-key-previous
    purpose: notification-endpoint-previous-keyring
    services: [outbox-worker]
    rotation: 6-12m
    owner: worker-owner
    binding: { mode: managed-mount, target: outbox-worker }
    version: { slot: previous, source: provider-assigned, firstDeployment: prepared-previous-required }
    lifecycle: { initialState: PREPARED, rotate: replace-with-former-current, retire: after-endpoint-reencryption-and-owner-approval }
  - secretId: registration-fingerprint-key
    purpose: registration-network-fingerprint
    services: [backend-api]
    runtimeBinding: provider-managed-environment
    environmentVariable: REGISTRATION_FINGERPRINT_KEY
    rotation: policy-defined
    owner: backend-owner
    binding: { mode: provider-managed-environment, target: backend-api.REGISTRATION_FINGERPRINT_KEY }
    version: { slot: single, source: provider-assigned, firstDeployment: required-at-startup }
    lifecycle: { initialState: PREPARED, rotate: update-environment-binding-and-rollout, retire: after-fingerprint-retention-review }
  - secretId: backup-encryption-key
    purpose: backup-client-encryption
    services: [backup-agent, restore-operator]
    rotation: 6-12m
    owner: backup-restore-owner
    binding: { mode: managed-mount, target: backup-agent|restore-operator }
    version: { slot: single, source: provider-assigned, firstDeployment: required-when-enabled }
    lifecycle: { initialState: PREPARED, rotate: reencrypt-and-verify-restore-before-retire, retire: owner-approval-after-restore-test }
  - secretId: mobile-signing-key
    purpose: mobile-release-signing
    services: [managed-build-service]
    rotation: policy-defined
    owner: mobile-release-owner
    binding: { mode: managed-build-service-only, target: mobile-release-signing-step }
    version: { slot: single, source: provider-assigned, firstDeployment: required-at-build }
    lifecycle: { initialState: PREPARED, rotate: update-managed-signing-credential, retire: after-release-and-build-retention-check }
states: [PREPARED, ACTIVE, DECRYPT_ONLY, REVOKED, DESTROY_PENDING, DESTROYED]

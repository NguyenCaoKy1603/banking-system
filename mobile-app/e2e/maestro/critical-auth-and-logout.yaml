appId: ${APP_ID}

---
- launchApp:
    clearState: true
- tapOn:
    id: login-email
- inputText: ${TEST_EMAIL}
- tapOn:
    id: login-password
- inputText: ${TEST_PASSWORD}
- tapOn:
    id: login-submit
- extendedWaitUntil:
    visible:
      id: login-mfa-submit
    timeout: 10000
- tapOn:
    id: login-mfa-code
- inputText: ${MFA_OTP}
- tapOn:
    id: login-mfa-submit
- extendedWaitUntil:
    visible:
      id: quick-transfer
    timeout: 15000
- tapOn:
    id: logout-all-devices
- extendedWaitUntil:
    visible:
      id: login-submit
    timeout: 10000

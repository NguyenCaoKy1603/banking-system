appId: ${APP_ID}

---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: login-email
    timeout: 180000
- tapOn:
    id: login-register
- extendedWaitUntil:
    visible:
      id: register-full-name
    timeout: 15000
- tapOn:
    id: register-full-name
- inputText: ${REGISTRATION_FULL_NAME}
- pressKey: BACK
- tapOn:
    id: register-email
- inputText: ${REGISTRATION_EMAIL}
- pressKey: BACK
- tapOn:
    id: register-phone
- inputText: ${REGISTRATION_PHONE}
- pressKey: BACK
- tapOn:
    id: register-password
- inputText: ${REGISTRATION_PASSWORD}
- pressKey: BACK
- tapOn:
    id: register-confirm-password
- inputText: ${REGISTRATION_PASSWORD}
- pressKey: BACK
- tapOn:
    id: register-submit
- waitForAnimationToEnd:
    timeout: 1000
- swipe:
    start: 50%, 88%
    end: 50%, 32%
    duration: 600
- extendedWaitUntil:
    visible:
      id: register-otp
    timeout: 15000
- tapOn:
    id: register-otp

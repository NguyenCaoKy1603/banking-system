appId: ${APP_ID}

---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: login-email
    timeout: 180000
- tapOn:
    id: login-email
- waitForAnimationToEnd:
    timeout: 1000
- inputText: ${TEST_EMAIL}
- waitForAnimationToEnd:
    timeout: 1000
- pressKey: BACK
- tapOn:
    id: login-password
- waitForAnimationToEnd:
    timeout: 1000
- inputText: ${TEST_PASSWORD}
- waitForAnimationToEnd:
    timeout: 1000
- pressKey: BACK
- tapOn:
    id: login-submit
- extendedWaitUntil:
    visible:
      id: home-balance-card
    timeout: 15000
- tapOn:
    id: tab-profile
- tapOn:
    id: profile-cards
- extendedWaitUntil:
    visible:
      id: credit-cards-list
    timeout: 15000
- tapOn:
    id: card-first
- extendedWaitUntil:
    visible:
      id: credit-card-detail
    timeout: 30000
- scrollUntilVisible:
    element:
      id: credit-open-transactions
    direction: DOWN
    visibilityPercentage: 50
    waitToSettleTimeoutMs: 1000
    timeout: 30000
- tapOn:
    id: credit-open-transactions
- extendedWaitUntil:
    visible:
      id: credit-transactions-list
    timeout: 10000
- tapOn:
    id: credit-transactions-back
- extendedWaitUntil:
    visible:
      id: credit-open-statements
    timeout: 10000
- tapOn:
    id: credit-open-statements
- extendedWaitUntil:
    visible:
      id: credit-statements-list
    timeout: 10000
- tapOn:
    id: credit-statements-back
- extendedWaitUntil:
    visible:
      id: credit-open-payment
    timeout: 10000
- tapOn:
    id: credit-open-payment
- extendedWaitUntil:
    visible:
      id: credit-payment-input
    timeout: 15000
- tapOn:
    id: credit-option-MINIMUM
- tapOn:
    id: credit-create-quote
- extendedWaitUntil:
    visible:
      id: credit-payment-review
    timeout: 10000
- tapOn:
    id: credit-review-confirm
- extendedWaitUntil:
    visible:
      id: credit-payment-step-up
    timeout: 10000
- tapOn:
    id: credit-step-up-code

appId: ${APP_ID}

---
- scrollUntilVisible:
    element:
      id: savings-submit
    direction: DOWN
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 1000
- tapOn:
    id: savings-submit
- extendedWaitUntil:
    visible:
      id: savings-open-result
    timeout: 15000
- tapOn:
    id: savings-open-list
- extendedWaitUntil:
    visible:
      id: savings-list-items
    timeout: 15000

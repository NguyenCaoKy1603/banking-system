appId: ${APP_ID}

---
- launchApp:
    clearState: true
- tapOn:
    id: login-email
- inputText: ${TEST_EMAIL}
- tapOn:
    id: login-password
- inputText: ${TEST_PASSWORD}
- tapOn:
    id: login-submit
- extendedWaitUntil:
    visible:
      id: login-mfa-submit
    timeout: 10000
- tapOn:
    id: login-mfa-code
- inputText: ${MFA_OTP}
- tapOn:
    id: login-mfa-submit
- extendedWaitUntil:
    visible:
      id: home-balance-card
    timeout: 15000
- tapOn:
    id: quick-deposit
- extendedWaitUntil:
    visible:
      id: savings-open-button
    timeout: 15000
- tapOn:
    id: savings-open-button
- extendedWaitUntil:
    visible:
      id: savings-amount
    timeout: 10000
- tapOn:
    id: savings-amount
- inputText: ${SAVINGS_AMOUNT_MINOR}
- scrollUntilVisible:
    element:
      id: savings-create-quote
    direction: DOWN
    timeout: 10000
- tapOn:
    id: savings-create-quote
- extendedWaitUntil:
    visible:
      id: savings-review-confirm
    timeout: 10000
- tapOn:
    id: savings-review-confirm
- tapOn:
    id: savings-step-up-code
- inputText: ${TRANSFER_OTP}
- pressKey: BACK
- tapOn:
    id: savings-submit
- extendedWaitUntil:
    visible:
      id: savings-open-result
    timeout: 15000
- tapOn:
    id: savings-open-list
- extendedWaitUntil:
    visible:
      id: savings-list-items
    timeout: 15000

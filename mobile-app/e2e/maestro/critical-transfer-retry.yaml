appId: ${APP_ID}

---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: login-email
    timeout: 90000
- tapOn:
    id: login-email
- inputText: ${TEST_EMAIL}
- tapOn:
    id: login-password
- inputText: ${TEST_PASSWORD}
- tapOn:
    id: login-submit
- extendedWaitUntil:
    visible:
      id: login-mfa-submit
    timeout: 10000
- tapOn:
    id: login-mfa-code
- inputText: ${MFA_OTP}
- tapOn:
    id: login-mfa-submit
- extendedWaitUntil:
    visible:
      id: quick-transfer
    timeout: 15000
- tapOn:
    id: quick-transfer
- extendedWaitUntil:
    visible:
      id: transfer-beneficiary-id
    timeout: 10000
- tapOn:
    id: transfer-open-beneficiaries
- extendedWaitUntil:
    visible:
      id: beneficiary-list
    timeout: 10000
- tapOn:
    id: beneficiary-row-${BENEFICIARY_ID}
- extendedWaitUntil:
    visible:
      id: transfer-beneficiary-id
    timeout: 10000
- tapOn:
    id: transfer-lookup-beneficiary
- extendedWaitUntil:
    visible:
      id: transfer-amount
    timeout: 10000
- tapOn:
    id: transfer-amount
- inputText: ${TRANSFER_AMOUNT_MINOR}
- tapOn:
    id: transfer-create-quote
- tapOn:
    id: transfer-create-quote
- extendedWaitUntil:
    visible:
      id: transfer-review-confirm
    timeout: 10000
- tapOn:
    id: transfer-review-confirm
- extendedWaitUntil:
    visible:
      id: transfer-step-up-code
    timeout: 10000
- tapOn:
    id: transfer-step-up-code
- inputText: ${TRANSFER_OTP}
- pressKey: BACK
- scrollUntilVisible:
    element:
      id: transfer-submit
    direction: DOWN
    timeout: 10000
- tapOn:
    id: transfer-submit
- extendedWaitUntil:
    visible:
      id: transfer-status-refresh
    timeout: 15000
- assertVisible: Giao dịch đang được xử lý
- stopApp
- launchApp
- tapOn:
    id: quick-transfer
- extendedWaitUntil:
    visible:
      id: transfer-status-refresh
    timeout: 15000
- tapOn:
    id: transfer-status-refresh
- assertVisible: Giao dịch đang được xử lý

appId: ${APP_ID}

---
- launchApp:
    clearState: true
- tapOn:
    id: login-email
- inputText: ${TEST_EMAIL}
- tapOn:
    id: login-password
- inputText: ${TEST_PASSWORD}
- tapOn:
    id: login-submit
- extendedWaitUntil:
    visible:
      id: login-mfa-submit
    timeout: 10000
- tapOn:
    id: login-mfa-code
- inputText: ${MFA_OTP}
- tapOn:
    id: login-mfa-submit
- extendedWaitUntil:
    visible:
      id: home-balance-card
    timeout: 15000
- tapOn:
    id: tab-profile
- tapOn:
    id: profile-cards
- extendedWaitUntil:
    visible:
      id: credit-cards-list
    timeout: 15000
- tapOn:
    id: card-first
- extendedWaitUntil:
    visible:
      id: credit-card-detail
    timeout: 10000
- tapOn:
    id: card-toggle-lock
- assertVisible: "Đã khóa"
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: home-balance-card
    timeout: 15000
- tapOn:
    id: tab-profile
- tapOn:
    id: profile-cards
- extendedWaitUntil:
    visible:
      id: credit-cards-list
    timeout: 15000
- tapOn:
    id: card-first
- extendedWaitUntil:
    visible:
      id: credit-card-detail
    timeout: 10000
- assertVisible: "Đã khóa"
- scrollUntilVisible:
    element:
      id: credit-unlock-code
    direction: DOWN
    timeout: 10000
- tapOn:
    id: credit-unlock-code
- inputText: ${TRANSFER_OTP}
- pressKey: BACK
- tapOn:
    id: card-toggle-lock
- assertVisible: "Thẻ đã được mở khóa sau bước xác thực."

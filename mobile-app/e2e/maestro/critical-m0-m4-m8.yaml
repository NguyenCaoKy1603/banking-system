appId: ${APP_ID}

---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: login-email
    timeout: 90000
- tapOn:
    id: login-email
- inputText: ${TEST_EMAIL}
- scrollUntilVisible:
    element:
      id: login-password
    direction: DOWN
    timeout: 10000
- tapOn:
    id: login-password
- inputText: ${TEST_PASSWORD}
- tapOn:
    id: login-submit
- extendedWaitUntil:
    visible:
      id: login-mfa-submit
    timeout: 10000
- tapOn:
    id: login-mfa-code
- inputText: ${MFA_OTP}
- tapOn:
    id: login-mfa-submit
- extendedWaitUntil:
    visible:
      id: home-balance-card
    timeout: 15000
- tapOn:
    id: home-toggle-balance
- tapOn:
    id: home-toggle-balance
- tapOn:
    id: home-toggle-account-number
- assertVisible: ${ACCOUNT_NUMBER}
- tapOn:
    id: home-copy-account-number
- tapOn:
    text: OK
- tapOn:
    id: home-toggle-account-number
- tapOn:
    id: account-detail
- extendedWaitUntil:
    visible:
      id: account-detail-toggle-number
    timeout: 10000
- tapOn:
    id: account-detail-toggle-number
- assertVisible: ${ACCOUNT_NUMBER}
- tapOn:
    id: account-detail-copy-number
- tapOn:
    text: OK
- tapOn:
    id: account-detail-back
- extendedWaitUntil:
    visible:
      id: home-balance-card
    timeout: 10000
- tapOn:
    id: tab-profile
- tapOn:
    id: profile-kyc
- extendedWaitUntil:
    visible:
      id: kyc-full-name
    timeout: 10000
- tapOn:
    id: kyc-identity-number
- inputText: 123456789
- scrollUntilVisible:
    element:
      id: kyc-address
    direction: DOWN
    timeout: 10000
- tapOn:
    id: kyc-address
- inputText: 123 Sandbox Street
- scrollUntilVisible:
    element:
      id: kyc-select-sample-document
    direction: DOWN
    timeout: 10000
- tapOn:
    id: kyc-select-sample-document
- tapOn:
    id: kyc-submit
- extendedWaitUntil:
    visible:
      id: kyc-pending-entitlement-note
    timeout: 10000
- tapOn:
    id: kyc-refresh-status
- tapOn:
    id: kyc-back
- tapOn:
    id: profile-beneficiaries
- extendedWaitUntil:
    visible:
      id: beneficiary-list
    timeout: 15000
- tapOn:
    id: beneficiaries-back
- tapOn:
    id: profile-qr
- extendedWaitUntil:
    visible:
      id: qr-code
    timeout: 15000
- tapOn:
    id: qr-scan
- scrollUntilVisible:
    element:
      id: qr-manual-payload
    direction: DOWN
    timeout: 10000
- tapOn:
    id: qr-manual-payload
- inputText: '{"version":1,"kind":"RECEIVE_MONEY","accountId":"1","displayName":"A","maskedAccountNumber":"1","bankName":"B","currency":"VND"}'
- tapOn:
    id: qr-parse-manual
- extendedWaitUntil:
    visible:
      id: qr-valid-payload
    timeout: 10000
- assertVisible:
    id: qr-transfer-blocked
- tapOn:
    id: tab-profile
- tapOn:
    id: profile-notifications
- extendedWaitUntil:
    visible:
      id: notification-first
    timeout: 15000
- tapOn:
    id: notification-first
- extendedWaitUntil:
    visible:
      id: notification-detail
    timeout: 10000
- tapOn:
    id: notification-open-target

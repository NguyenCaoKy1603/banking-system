appId: ${APP_ID}

---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: login-email
    timeout: 180000
- tapOn:
    id: login-email
- waitForAnimationToEnd:
    timeout: 1000
- inputText: ${TEST_EMAIL}
- waitForAnimationToEnd:
    timeout: 1000
- pressKey: BACK
- tapOn:
    id: login-password
- waitForAnimationToEnd:
    timeout: 1000
- inputText: ${TEST_PASSWORD}
- waitForAnimationToEnd:
    timeout: 1000
- hideKeyboard
- tapOn:
    id: login-submit
- extendedWaitUntil:
    visible:
      id: home-balance-card
    timeout: 15000
- tapOn:
    id: quick-deposit
- extendedWaitUntil:
    visible:
      id: savings-open-button
    timeout: 15000
- tapOn:
    id: savings-open-button
- extendedWaitUntil:
    visible:
      id: savings-amount
    timeout: 10000
- tapOn:
    id: savings-amount
- inputText: ${SAVINGS_AMOUNT_MINOR}
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 2000
- scrollUntilVisible:
    element:
      id: savings-create-quote
    direction: DOWN
    timeout: 10000
- tapOn:
    id: savings-create-quote
- extendedWaitUntil:
    visible:
      id: savings-review-confirm
    timeout: 10000
- tapOn:
    id: savings-review-confirm
- tapOn:
    id: savings-step-up-code

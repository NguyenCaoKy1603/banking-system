appId: ${APP_ID}

---
- scrollUntilVisible:
    element:
      id: credit-submit-payment
    direction: DOWN
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 1000
- tapOn:
    id: credit-submit-payment
- extendedWaitUntil:
    visible:
      id: credit-payment-result
    timeout: 30000
- tapOn:
    id: credit-payment-done

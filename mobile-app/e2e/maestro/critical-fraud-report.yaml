appId: ${APP_ID}

---
- launchApp:
    clearState: true
- tapOn:
    id: login-email
- inputText: ${TEST_EMAIL}
- tapOn:
    id: login-password
- inputText: ${TEST_PASSWORD}
- tapOn:
    id: login-submit
- extendedWaitUntil:
    visible:
      id: login-mfa-submit
    timeout: 10000
- tapOn:
    id: login-mfa-code
- inputText: ${MFA_TOTP}
- tapOn:
    id: login-mfa-submit
- extendedWaitUntil:
    visible:
      id: home-balance-card
    timeout: 15000
- tapOn:
    id: account-detail
- extendedWaitUntil:
    visible:
      id: account-detail-history
    timeout: 10000
- tapOn:
    id: account-detail-history
- extendedWaitUntil:
    visible:
      id: first-transaction
    timeout: 15000
- tapOn:
    id: first-transaction
- extendedWaitUntil:
    visible:
      id: transaction-fraud-report
    timeout: 10000
- tapOn:
    id: transaction-fraud-report
- extendedWaitUntil:
    visible:
      id: fraud-reason
    timeout: 10000
- tapOn:
    id: fraud-reason
- inputText: Tôi không thực hiện giao dịch này
- tapOn:
    id: fraud-submit
- assertVisible: Đã tiếp nhận báo cáo

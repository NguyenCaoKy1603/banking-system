name: Container release (immutable)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: container-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/banking-backend
      RELEASE_ID: release-${{ github.run_number }}-${{ github.sha }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout the exact merge commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify clean source and tracked migrations
        working-directory: backend
        run: node scripts/release-gate.cjs

      - name: Scan repository and Git history for high-confidence secrets
        working-directory: backend
        run: npm run validate:secrets -- --history

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Run release quality gates
        working-directory: backend
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm audit --omit=dev --audit-level=high
          npm run release:migration-fingerprint

      - name: Compute API contract digest
        id: contract
        shell: bash
        run: echo "digest=sha256:$(sha256sum documents/api/banking-mvp.openapi.yaml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push one immutable image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ env.RELEASE_ID }}
          build-args: |
            COMMIT_SHA=${{ env.COMMIT_SHA }}
            RELEASE_ID=${{ env.RELEASE_ID }}
            BUILD_CREATED_AT=${{ github.event.head_commit.timestamp || github.run_started_at }}
            API_CONTRACT_DIGEST=${{ steps.contract.outputs.digest }}
          labels: |
            org.opencontainers.image.revision=${{ env.COMMIT_SHA }}
            org.opencontainers.image.version=${{ env.RELEASE_ID }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the pushed manifest digest with GitHub OIDC
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Pull and smoke the exact pushed digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker pull "${IMAGE_NAME}@${IMAGE_DIGEST}"
          test "$(docker image inspect "${IMAGE_NAME}@${IMAGE_DIGEST}" --format '{{.Config.User}}')" = "node"
          docker run --rm "${IMAGE_NAME}@${IMAGE_DIGEST}" node -e "const fs=require('fs'); if (fs.existsSync('/app/node_modules/tsx')) process.exit(1)"

      - name: Create release manifest artifact
        working-directory: backend
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          npm run release:manifest -- \
            --output ../release-manifest.json \
            --source-commit "${COMMIT_SHA}" \
            --image "${IMAGE_NAME}" \
            --image-digest "${IMAGE_DIGEST}" \
            --release-id "${RELEASE_ID}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --signature-verified true \
            --sbom-present true \
            --provenance-present true

      - name: Upload release manifest and build evidence
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_ID }}-release-evidence
          path: release-manifest.json
          if-no-files-found: error

name: Admin Web quality

on:
  push:
    paths:
      - "admin-web/**"
      - "backend/src/admin/**"
      - "backend/src/mfa/**"
      - "backend/src/security.ts"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "documents/api/admin.openapi.yaml"
      - ".github/workflows/admin-web-quality.yml"
  pull_request:
    paths:
      - "admin-web/**"
      - "backend/src/admin/**"
      - "backend/src/mfa/**"
      - "backend/src/security.ts"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "documents/api/admin.openapi.yaml"
      - ".github/workflows/admin-web-quality.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Install backend dependencies for browser fixture
        run: npm ci
        working-directory: backend
      - name: Build backend for browser fixture
        run: npm run build
        working-directory: backend
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

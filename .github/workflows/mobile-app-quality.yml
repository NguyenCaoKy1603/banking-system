name: Mobile app quality

on:
  push:
    paths:
      - "mobile-app/**"
      - "backend/**"
      - "documents/**"
      - ".github/workflows/mobile-app-quality.yml"
  pull_request:
    paths:
      - "mobile-app/**"
      - "backend/**"
      - "documents/**"
      - ".github/workflows/mobile-app-quality.yml"

defaults:
  run:
    working-directory: mobile-app

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit (release gate)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Validate OpenAPI contract
        run: npm run validate:openapi

      - name: Validate native E2E flow definitions
        run: npm run validate:e2e

      - name: Validate release configuration
        run: npm run validate:release

      - name: Generate Expo Router types
        run: npm run generate:routes

      - name: Validate Expo native configuration
        run: npx expo config --type public > expo-config.json

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Coverage threshold
        run: npm run test:coverage -- --runInBand

      - name: Web export smoke test
        env:
          EXPO_PUBLIC_API_URL: https://ci.example.invalid/api/v1
        run: npm run export:web

      - name: Upload mobile quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-quality-${{ github.run_id }}
          path: mobile-app/coverage
          if-no-files-found: ignore

  backend-quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://banking:banking@localhost:5432/banking_test
      RELATIONAL_DATABASE_URL: postgresql://banking:banking@localhost:5432/banking_test
      P0_RELATIONAL_DATABASE_URL: postgresql://banking:banking@localhost:5432/banking_worker_test
      WORKER_DATABASE_URL: postgresql://banking:banking@localhost:5432/banking_worker_test
      NOTIFICATION_ENDPOINT_ENCRYPTION_KEY: ci-worker-only-key
      BANKING_ENV: development
      BANKING_MFA_REQUIRED: "0"
      BANKING_OTP_PEPPER: "base64:Y2ktb3RwLXBlcHBlci0wMTIzNDU2Nzg5MDEyMzQ1Njc="
      BANKING_MFA_ENCRYPTION_KEY: "base64:Y2ktbWZhLWVuY3J5cHRpb24ta2V5LTAxMjM0NTY3ODk="

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: banking
          POSTGRES_PASSWORD: banking
          POSTGRES_DB: banking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U banking -d banking_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply PostgreSQL migration
        run: npm run db:migrate

      - name: Create and migrate worker database
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE banking_worker_test"
          DATABASE_URL="$WORKER_DATABASE_URL" npm run db:migrate

      - name: Re-run PostgreSQL migration idempotently
        run: npm run db:migrate

      - name: Validate database boundary schema
        run: npm run validate:database

      - name: Dependency security audit (release gate)
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Build backend artifact
        run: npm run build

      - name: Unit and HTTP contract tests
        run: npm test

      - name: Critical API integration flow
        run: npm run test:critical

      - name: Worker concurrency, lease and dead-letter regression
        run: npm run test:worker

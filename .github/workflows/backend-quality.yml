name: Backend quality

on:
  push:
    paths:
      - "backend/**"
      - "documents/api/**"
      - "documents/admin/**"
      - ".github/workflows/backend-quality.yml"
  pull_request:
    paths:
      - "backend/**"
      - "documents/api/**"
      - "documents/admin/**"
      - ".github/workflows/backend-quality.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://banking:banking@localhost:5432/banking_test_core
      RELATIONAL_DATABASE_URL: postgresql://banking:banking@localhost:5432/banking_test_relational
      P0_RELATIONAL_DATABASE_URL: postgresql://banking:banking@localhost:5432/banking_test_p0
      WORKER_DATABASE_URL: postgresql://banking:banking@localhost:5432/banking_test_worker
      ADMIN_DATABASE_URL: postgresql://banking:banking@localhost:5432/banking_test_admin
      DATABASE_TEST_ADMIN_URL: postgresql://banking:banking@localhost:5432/postgres
      NOTIFICATION_ENDPOINT_ENCRYPTION_KEY: ci-worker-only-key
      NODE_ENV: test
      BANKING_ENV: test
      ALLOW_DATABASE_TEST_RESET: "1"
      BANKING_MFA_REQUIRED: "0"
      BANKING_OTP_PEPPER: "base64:Y2ktb3RwLXBlcHBlci0wMTIzNDU2Nzg5MDEyMzQ1Njc="
      BANKING_MFA_ENCRYPTION_KEY: "base64:Y2ktbWZhLWVuY3J5cHRpb24ta2V5LTAxMjM0NTY3ODk="

    services:
      postgres:
        image: postgres:16@sha256:c1b3783309b6499c795eed7c20135a1a4d25cae1b575c3d52c6f536129a1b109
        env:
          POSTGRES_USER: banking
          POSTGRES_PASSWORD: banking
          POSTGRES_DB: banking_test_core
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U banking -d banking_test_core"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate repository secret surface
        run: |
          npm run validate:secrets
          npm run validate:secret-registry

      - name: Create disposable P0 relational database
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE banking_test_relational"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE banking_test_p0"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE banking_test_worker"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE banking_test_admin"

      - name: Apply PostgreSQL migration from empty database
        run: npm run db:migrate

      - name: Verify migration plan and checksums
        run: |
          npm run db:migrate -- --plan
          npm run db:migrate -- --verify-only

      - name: Re-run PostgreSQL migration idempotently
        run: npm run db:migrate

      - name: Apply P0 migrations to disposable database
        env:
          DATABASE_URL: postgresql://banking:banking@localhost:5432/banking_test_p0
        run: npm run db:migrate

      - name: Apply relational migrations to disposable database
        env:
          DATABASE_URL: postgresql://banking:banking@localhost:5432/banking_test_relational
        run: npm run db:migrate

      - name: Apply Admin migrations to disposable database
        env:
          DATABASE_URL: postgresql://banking:banking@localhost:5432/banking_test_admin
        run: npm run db:migrate

      - name: Apply worker migrations to disposable database
        env:
          DATABASE_URL: postgresql://banking:banking@localhost:5432/banking_test_worker
        run: npm run db:migrate

      - name: Validate database boundary
        run: npm run validate:database

      - name: Validate relational-v2 invariants
        run: npm run validate:relational-v2

      - name: Validate transactional outbox worker boundary
        env:
          DATABASE_URL: postgresql://banking:banking@localhost:5432/banking_test_worker
        run: npm run validate:outbox

      - name: Validate OpenAPI draft and implementation markers
        run: npm run validate:openapi

      - name: Validate Admin schema, authorization registry and OpenAPI
        run: |
          npm run validate:admin-schema
          npm run validate:admin-authz
          npm run validate:admin-openapi

      - name: Dependency security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Verify disposable PostgreSQL guard rejects unsafe targets
        run: npm run test:database:guard

      - name: Typecheck
        run: npm run typecheck

      - name: Build backend artifact
        run: npm run build

      - name: Unit, HTTP and PostgreSQL persistence tests
        env:
          DATABASE_URL: ""
          RELATIONAL_DATABASE_URL: ""
          P0_RELATIONAL_DATABASE_URL: ""
          WORKER_DATABASE_URL: ""
          ADMIN_DATABASE_URL: ""
        run: npm test

      - name: Critical API tests
        run: npm run test:critical

      - name: Admin authorization and four-eyes tests
        run: npm run test:admin

      - name: Admin PostgreSQL integration and concurrency tests
        run: |
          npm run test:admin:database
          npm run test:admin:concurrency

      - name: Relational persistence regression
        run: npm run test:relational

      - name: Legacy snapshot persistence regression
        run: npm run test:persistence

      - name: Relational-v2 foundation regression
        run: npm run test:database

      - name: Persistent MFA lifecycle regression
        run: npm run test:mfa:persistence

      - name: Relational Savings opening regression
        run: npm run test:savings:persistence

      - name: Relational Credit payment and lifecycle regression
        run: npm run test:credit:persistence

      - name: Remaining relational recipient, notification and fraud regression
        run: npm run test:remaining:persistence

      - name: Worker concurrency, lease and dead-letter regression
        run: npm run test:worker

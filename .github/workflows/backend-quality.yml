name: Backend quality

on:
  push:
    paths:
      - "backend/**"
      - "documents/api/**"
      - ".github/workflows/backend-quality.yml"
  pull_request:
    paths:
      - "backend/**"
      - "documents/api/**"
      - ".github/workflows/backend-quality.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://banking:banking@localhost:5432/banking_test
      RELATIONAL_DATABASE_URL: postgresql://banking:banking@localhost:5432/banking_test
      P0_RELATIONAL_DATABASE_URL: postgresql://banking:banking@localhost:5432/banking_p0_test
      WORKER_DATABASE_URL: postgresql://banking:banking@localhost:5432/banking_worker_test
      NOTIFICATION_ENDPOINT_ENCRYPTION_KEY: ci-worker-only-key
      BANKING_ENV: development
      BANKING_MFA_REQUIRED: "0"
      BANKING_SANDBOX_MFA_OTP: "654321"
      BANKING_SANDBOX_OTP: "123456"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: banking
          POSTGRES_PASSWORD: banking
          POSTGRES_DB: banking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U banking -d banking_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create disposable P0 relational database
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE banking_p0_test"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE banking_worker_test"

      - name: Apply PostgreSQL migration from empty database
        run: npm run db:migrate

      - name: Re-run PostgreSQL migration idempotently
        run: npm run db:migrate

      - name: Apply P0 migrations to disposable database
        env:
          DATABASE_URL: postgresql://banking:banking@localhost:5432/banking_p0_test
        run: npm run db:migrate

      - name: Apply worker migrations to disposable database
        env:
          DATABASE_URL: postgresql://banking:banking@localhost:5432/banking_worker_test
        run: npm run db:migrate

      - name: Validate database boundary
        run: npm run validate:database

      - name: Validate relational-v2 invariants
        run: npm run validate:relational-v2

      - name: Validate transactional outbox worker boundary
        env:
          DATABASE_URL: postgresql://banking:banking@localhost:5432/banking_worker_test
        run: npm run validate:outbox

      - name: Validate OpenAPI draft and implementation markers
        run: npm run validate:openapi

      - name: Dependency security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Build backend artifact
        run: npm run build

      - name: Unit, HTTP and PostgreSQL persistence tests
        run: npm test

      - name: Critical API tests
        run: npm run test:critical

      - name: Relational persistence regression
        env:
          RELATIONAL_DATABASE_URL: postgresql://banking:banking@localhost:5432/banking_test
        run: npm run test:relational

      - name: Relational-v2 foundation regression
        run: npm run test:database

      - name: Worker concurrency, lease and dead-letter regression
        run: npm run test:worker

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; connect-src 'self' http://127.0.0.1:5001 http://localhost:5001; style-src 'self' 'unsafe-inline'; style-src-attr 'unsafe-inline'; script-src 'self'; script-src-attr 'none'; frame-src 'none'; frame-ancestors 'none'; form-action 'self'" always;
  add_header Cache-Control "no-store" always;
  location / { try_files $uri /index.html; }
}
